<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><meta name="description" content="A special birthday letter, blooming into a luminous rose."><title>A Special Birthday Letter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#d9c8bd;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}body{height:100svh;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:1px solid #e9b185;outline-offset:5px}#art{position:absolute;inset:0;width:100%;height:100%;display:block}main{position:relative;height:100%;isolation:isolate}header{position:absolute;top:28px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:2px;color:#8b7770}header span{opacity:.65}.tools{display:flex;gap:20px}.quiet{background:none;border:0;padding:8px 0;font-size:11px;color:#9d8d86;letter-spacing:1px}.quiet:hover{color:#f3cfb2}.greeting{position:absolute;left:20px;right:20px;bottom:11%;text-align:center;opacity:0;transform:translateY(8px);transition:opacity 1.8s,transform 1.8s;pointer-events:none}.greeting.show{opacity:1;transform:none}.greeting .eyebrow{font-size:10px;color:#916352;letter-spacing:4px;margin:0 0 15px}h1{font-weight:400;font-size:clamp(18px,3vw,27px);letter-spacing:2px;color:#dcad96;margin:0 0 13px;text-shadow:0 0 22px #b24b3c60}.message{font-size:11px;line-height:1.9;color:#8f8580;margin:auto;max-width:470px;white-space:pre-line}.signature{font-size:10px;color:#b47566;margin-top:14px}.bottom{position:absolute;bottom:23px;left:24px;right:24px;display:flex;justify-content:center;gap:28px;align-items:center}.bottom button{font-size:10px}dialog{width:min(440px,calc(100% - 32px));background:#100d0d;color:#d6bbb0;border:1px solid #3a2925;border-radius:6px;padding:28px;max-height:90svh;overflow:auto}dialog::backdrop{background:#000b;backdrop-filter:blur(8px)}dialog h2{font-weight:400;font-size:19px;margin:0 0 24px}label{display:block;font-size:11px;line-height:1.5;margin:16px 0 6px;color:#ad9286}input,textarea{width:100%;background:#060505;border:1px solid #3e2b27;color:#e7c7b9;padding:11px;border-radius:3px;font-size:12px}textarea{resize:vertical;min-height:90px}.actions{display:flex;justify-content:flex-end;gap:20px;margin-top:22px}.primary{border:1px solid #82503f;background:#3b241d;padding:10px 18px;border-radius:3px;font-size:12px}.note{font-size:10px;line-height:1.7;color:#816e65}#status{font-size:10px;color:#aa8a79;min-height:16px} @media(max-width:600px){header{top:15px;left:20px;right:20px}header span{font-size:8px;letter-spacing:1.4px}.greeting{bottom:13%}.message{max-width:310px;font-size:10px}.greeting .eyebrow{font-size:9px;letter-spacing:2.5px}.tools{gap:15px}.bottom{bottom:16px}}@media(prefers-reduced-motion:reduce){.greeting{transition:none}}
</style></head>
<body><main><canvas id="art" aria-label="Glowing character-art letter transforming into a red rose with a green stem and blue sparkling trails" role="img"></canvas><header><span>A SPECIAL LETTER</span><div class="tools"><button class="quiet" id="edit">Personalize</button></div></header><section class="greeting" aria-live="polite"><p class="eyebrow">A LITTLE MAGIC, JUST FOR YOU</p><h1 id="heading"></h1><p class="message" id="message"></p><p class="signature" id="signature"></p></section><nav class="bottom" aria-label="Animation controls"><button class="quiet" id="replay">↻ Replay</button><button class="quiet" id="pause">Ⅱ Pause</button><button class="quiet" id="share">Copy greeting link</button></nav></main>
<dialog id="editor"><form id="form"><h2>Your birthday letter</h2><label for="name">Birthday person's name</label><input id="name" maxlength="36" placeholder="Your name"><label for="wish">Birthday message</label><textarea id="wish" maxlength="240"></textarea><label for="sender">From</label><input id="sender" maxlength="45" placeholder="Someone who cares"><p class="note">Edits stay in this browser. “Copy greeting link” includes your message in a link you can share.</p><div id="status" role="status"></div><div class="actions"><button type="button" class="quiet" id="cancel">Cancel</button><button class="primary" type="submit">Save letter</button></div></form></dialog>
<script src="app.js"></script></body></html>
